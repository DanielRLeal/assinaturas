name: Assinaturas de email

on:
  schedule:
    - cron: "17 6 * * *"   # todos os dias, cerca das 7h de Lisboa
  workflow_dispatch:        # permite correr à mão no separador Actions

permissions:
  contents: write
  pages: write              # publicar as imagens no GitHub Pages
  id-token: write           # entrar no Google Cloud sem chave (Workload Identity Federation)

concurrency:
  group: assinaturas
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      CONTA_SERVICO: ${{ vars.CONTA_SERVICO }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      URL_BASE_IMAGENS: ${{ vars.URL_BASE_IMAGENS }}
      URL_SITE: ${{ vars.URL_SITE || 'https://orira.app' }}
      EXCLUIR: ${{ vars.EXCLUIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Entrar no Google Cloud (sem chave)
        if: vars.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar imagens em falta
        run: python sincronizar.py gerar

      - name: Guardar as imagens no repositório
        id: publicar
        run: |
          git config user.name "assinaturas-bot"
          git config user.email "assinaturas-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "novas=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualizar assinaturas"
            git push
            echo "novas=sim" >> "$GITHUB_OUTPUT"
          fi

      # Um push feito com o GITHUB_TOKEN não reconstrói o Pages; publica-se aqui.
      - uses: actions/configure-pages@v5
        if: steps.publicar.outputs.novas == 'sim'

      - uses: actions/upload-pages-artifact@v3
        if: steps.publicar.outputs.novas == 'sim'
        with:
          path: docs

      - name: Publicar no GitHub Pages
        if: steps.publicar.outputs.novas == 'sim'
        uses: actions/deploy-pages@v4

      - name: Aplicar assinaturas no Gmail
        run: python sincronizar.py aplicar

      - name: Guardar o que ficou aplicado
        run: |
          git add docs
          git diff --cached --quiet || (git commit -m "Assinaturas aplicadas" && git push)
